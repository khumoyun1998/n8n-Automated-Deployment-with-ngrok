services:
  n8n:
    image: n8nio/n8n:2.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # n8n 1.0+ removed N8N_BASIC_AUTH_*. Access is protected by n8n's
      # built-in user management: the first visit creates an owner account.
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_SECURE_COOKIE=true
      # N8N_HOST / WEBHOOK_URL / N8N_EDITOR_BASE_URL come from .env
      # and are filled in automatically by update-ngrok-webhook.sh
    volumes:
      - ./n8n-data:/home/node/.n8n
    env_file:
      - .env
